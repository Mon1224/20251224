# Alembic config for insurance_agent (AI database).
# Shares alembic/env.py with alembic.ini, distinguished only by db_key.
# NOTE: keep this file ASCII-only. Alembic reads it with the system locale
# encoding (GBK on Chinese Windows), so non-ASCII characters break it.

[alembic]
script_location = alembic
prepend_sys_path = .
db_key = agent
version_locations = alembic/versions_agent

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
